<footer class="bg-body-tertiary text-center">
  <!-- Grid container -->
  <div class="container p-4">
    <!-- Social & Professional Links -->
    <section class="mb-2 d-flex justify-content-center gap-3">
      <!-- GitHub -->
      <a 
        class="btn btn-outline-dark btn-floating rounded-circle" 
        [href]="authorGithubLink" 
        target="_blank" 
        rel="noopener noreferrer" 
        role="button"
        aria-label="GitHub"
      >
        <i class="bi bi-github"></i>
      </a>

      <!-- LinkedIn -->
      <a 
        class="btn btn-outline-dark btn-floating rounded-circle" 
        [href]="authorLinkedinLink" 
        target="_blank" 
        rel="noopener noreferrer" 
        role="button"
        aria-label="LinkedIn"
      >
        <i class="bi bi-linkedin"></i>
      </a>

      <!-- Email -->
      <a 
        class="btn btn-outline-dark btn-floating rounded-circle" 
        [href]="'mailto:' + authorEmail" 
        role="button"
        aria-label="Email"
      >
        <i class="bi bi-envelope-fill"></i>
      </a>
    </section>
  </div>
  <!-- Grid container -->

  <!-- Copyright -->
  <div class="text-center p-3" style="background-color: rgba(0, 0, 0, 0.05);">
    © 2026 Copyright:
    <h6 class="text-body fw-bold" style="text-decoration: none;"> {{authorName}}</h6>
  </div>
  <!-- Copyright -->
</footer>
